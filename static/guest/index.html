<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню — Matcha Club</title>
    <meta name="description" content="Меню Matcha Club & Mari Wellness: фото, состав и КБЖУ каждого блюда.">
    <link rel="stylesheet" href="styles.css?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header id="site-header">
        <img src="../img/logo_blue.png" alt="Matcha Club" class="site-logo">
    </header>

    <main id="main">
        <section class="hero">
            <div class="hero-kicker">Matcha Club &amp; Mari Wellness</div>
            <h1>Меню</h1>
            <p>Листайте фото, смотрите состав и КБЖУ каждого блюда —<br>нажмите на карточку, чтобы рассмотреть подробнее.</p>
        </section>

        <section id="fact-card" class="fact-card hidden">
            <div class="fact-icon">💡</div>
            <div>
                <div class="fact-label">Знаете ли вы?</div>
                <div id="fact-text" class="fact-text">Загрузка...</div>
            </div>
        </section>

        <nav id="cat-nav" class="cat-nav">
            <div id="cat-nav-inner" class="cat-nav-inner"></div>
        </nav>

        <div id="menu-root">
            <div class="loader"><div class="spinner"></div><p>Загружаем меню...</p></div>
        </div>
    </main>

    <section id="philosophy-card" class="philosophy-card hidden">
        <p id="philosophy-text"></p>
    </section>

    <footer class="site-footer">
        <img src="../img/logo_blue.png" alt="Matcha Club" class="footer-logo">
        <p class="footer-title">Matcha Club &amp; Mari Wellness</p>
        <a id="instagram-link" href="#" target="_blank" rel="noopener" class="instagram-link hidden"></a>

        <div class="branches-title">Наши филиалы</div>
        <div id="branches-list" class="branches-list"></div>

        <p id="allergy-note" class="allergy-note"></p>
    </footer>

    <!-- Детальная карточка блюда -->
    <div id="dish-modal" class="dish-modal">
        <div class="dish-modal-backdrop"></div>
        <div class="dish-modal-sheet">
            <button class="dish-modal-close" id="dish-modal-close" aria-label="Закрыть">✕</button>
            <div class="dish-modal-photo" id="dish-modal-photo"></div>
            <div class="dish-modal-body">
                <div class="dish-modal-name-row">
                    <h2 id="dish-modal-name"></h2>
                    <span id="dish-modal-volume" class="dish-modal-volume"></span>
                </div>
                <div class="dish-modal-price-row">
                    <span id="dish-modal-price" class="dish-modal-price"></span>
                    <span id="dish-modal-price-note" class="dish-modal-price-note"></span>
                </div>
                <p id="dish-modal-desc" class="dish-modal-desc"></p>
                <div id="dish-modal-kbzhu" class="kbzhu-row"></div>
                <p id="dish-modal-ingredients" class="dish-modal-ingredients"></p>
                <p id="dish-modal-allergens" class="item-allergens"></p>
            </div>
        </div>
    </div>

    <script src="app.js?v=3"></script>
</body>
</html>
