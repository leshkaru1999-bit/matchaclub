<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F6F3EA">
    <title>Меню — Matcha Club</title>
    <meta name="description" content="Меню Matcha Club & Mari Wellness: фото, состав и КБЖУ каждого блюда.">
    <link rel="preload" href="fonts/Inter-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="media/latte.jpg" as="image">
    <link rel="stylesheet" href="styles.css?v=6">
</head>
<body class="is-loading">
    <!-- Заставка: индиго-экран с логотипом, как у приложений-кофеен -->
    <div id="splash" class="splash" aria-hidden="true">
        <img src="../img/logo_white.png" alt="" class="splash-logo">
    </div>

    <!-- Видео-баннер -->
    <section class="hero" id="hero" aria-label="Сезонное в Matcha Club">
        <div class="hero-media" id="hero-media"></div>
        <div class="hero-shade"></div>
        <div class="hero-top">
            <img src="../img/logo_white.png" alt="Matcha Club" class="hero-logo">
            <a href="#site-footer" class="hero-btn" aria-label="Филиалы и контакты">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            </a>
        </div>
        <div class="hero-progress" id="hero-progress"></div>
        <button class="hero-caption" id="hero-caption" type="button">
            <span class="hero-title" id="hero-title">&nbsp;</span>
            <span class="hero-sub" id="hero-sub">&nbsp;</span>
        </button>
    </section>

    <!-- Двухуровневые вкладки -->
    <nav class="tabs" id="tabs" aria-label="Разделы меню">
        <div class="tabs-main" id="tabs-main"></div>
        <div class="tabs-sub" id="tabs-sub"></div>
    </nav>

    <main id="menu-root" class="menu-root">
        <div class="skeleton" aria-hidden="true">
            <div class="sk sk-title"></div>
            <div class="sk-row"><div class="sk sk-mini"></div><div class="sk sk-mini"></div><div class="sk sk-mini"></div><div class="sk sk-mini"></div></div>
            <div class="sk sk-title"></div>
            <div class="sk-grid"><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div></div>
        </div>
    </main>

    <footer class="site-footer" id="site-footer">
        <p id="philosophy-text" class="philosophy hidden"></p>
        <div class="footer-title">наши филиалы</div>
        <div id="branches-list" class="branches-list"></div>
        <a id="instagram-link" href="#" target="_blank" rel="noopener" class="instagram-link hidden"></a>
        <p id="allergy-note" class="allergy-note hidden"></p>
        <img src="../img/logo_blue.png" alt="Matcha Club" class="footer-logo">
    </footer>

    <!-- Карточка блюда на весь экран -->
    <div id="dish" class="dish" role="dialog" aria-modal="true" aria-labelledby="dish-name" hidden>
        <div class="dish-bg" id="dish-bg"></div>
        <div class="dish-shade"></div>
        <div class="dish-head">
            <div class="dish-grabber"></div>
            <h2 id="dish-name" class="dish-name"></h2>
            <button class="dish-close" id="dish-close" type="button" aria-label="Закрыть">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
            <div id="dish-kbzhu" class="dish-kbzhu"></div>
            <button id="dish-more-btn" class="dish-more-btn" type="button" aria-expanded="false">
                подробнее
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div id="dish-more" class="dish-more">
                <div class="dish-more-inner">
                    <p id="dish-desc" class="dish-desc"></p>
                    <p id="dish-ingredients" class="dish-ingredients"></p>
                    <p id="dish-allergens" class="dish-allergens"></p>
                    <p id="dish-price-note" class="dish-price-note"></p>
                </div>
            </div>
        </div>
        <div class="dish-bar">
            <span id="dish-volume" class="dish-volume"></span>
            <span id="dish-price" class="dish-price"></span>
        </div>
    </div>

    <script src="app.js?v=6"></script>
</body>
</html>
