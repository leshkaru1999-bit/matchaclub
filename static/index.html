<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matcha Club</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css?v=20260928b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Заголовок Glassmorphism -->
        <header id="header" class="glass-panel">
            <img src="img/logo_blue.png" alt="Matcha Club" class="header-logo logo-light">
            <img src="img/logo_white.png" alt="Matcha Club" class="header-logo logo-dark hidden">
            <div id="user-points" class="hidden">
                <span class="points-icon">🍃</span> 
                <span id="points-val">0</span>
            </div>
        </header>

        <!-- Контент страниц -->
        <main id="main-content">
            <div class="loader">
                <div class="spinner"></div>
                <p>Завариваем матчу...</p>
            </div>
        </main>

        <!-- Нижняя навигация Glassmorphism -->
        <nav id="bottom-nav" class="glass-panel">
            <button class="nav-item active" data-target="home">
                <span class="icon">✨</span>
                <span class="label">Главная</span>
            </button>
            <button class="nav-item" data-target="welcome">
                <span class="icon">📖</span>
                <span class="label">О нас</span>
            </button>
            <button class="nav-item" data-target="menu">
                <span class="icon">🌿</span>
                <span class="label">Меню</span>
            </button>
            <button class="nav-item" data-target="quiz">
                <span class="icon">🎯</span>
                <span class="label">Квиз</span>
            </button>
            <button class="nav-item" data-target="profile">
                <span class="icon">👤</span>
                <span class="label">Профиль</span>
            </button>
        </nav>
    </div>

    <!-- Шаблоны страниц -->
    
    <!-- Экран правил (показывается один раз) -->
    <template id="tpl-rules">
        <div class="page rules-page animate-fade-in" style="display: flex; flex-direction: column; height: 100vh; background: var(--tg-theme-bg-color);">
            <div class="rules-content" style="flex: 1; overflow-y: auto; padding: 20px;">
                <div class="premium-card text-center" style="margin-bottom: 20px;">
                    <div class="quiz-hero-icon" style="font-size: 40px; margin-bottom: 10px;">📄</div>
                    <h2>СОГЛАШЕНИЕ (ОФЕРТА)</h2>
                    <p style="color: var(--tg-theme-hint-color);">об использовании корпоративного образовательного Telegram-бота</p>
                </div>
                
                <div class="premium-card" style="font-size: 14px; line-height: 1.6;">
                    <p>Настоящее Соглашение определяет условия предоставления и использования корпоративного образовательного Telegram-бота (далее — «Бот») сотрудниками компании.</p>
                    <p>Получая доступ к Боту и начиная его использование, сотрудник подтверждает свое согласие со всеми условиями настоящего Соглашения.</p>
                    
                    <h3 style="margin-top: 15px; margin-bottom: 10px; font-size: 16px;">1. Назначение Бота</h3>
                    <p>Корпоративный образовательный Telegram-бот создан исключительно для обучения, адаптации и профессионального развития сотрудников компании.</p>
                    <p>В Боте могут размещаться:</p>
                    <ul style="padding-left: 20px; margin-top: 5px; margin-bottom: 15px;">
                        <li>внутренние стандарты работы;</li>
                        <li>регламенты;</li>
                        <li>инструкции;</li>
                        <li>обучающие материалы;</li>
                        <li>стандаррты сервиса;</li>
                        <li>меню и технологические процессы;</li>
                        <li>корпоративные документы;</li>
                        <li>тесты и материалы для оценки знаний;</li>
                        <li>иная информация, предназначенная исключительно для внутреннего использования.</li>
                    </ul>

                    <h3 style="margin-top: 15px; margin-bottom: 10px; font-size: 16px;">2. Конфиденциальность информации</h3>
                    <p>Вся информация, размещенная в Боте, является интеллектуальной собственностью компании и относится к внутренней информации ограниченного доступа.</p>
                    <p>Сотруднику запрещается:</p>
                    <ul style="padding-left: 20px; margin-top: 5px; margin-bottom: 15px;">
                        <li>передавать доступ к Боту третьим лицам;</li>
                        <li>пересылать материалы Бота;</li>
                        <li>копировать тексты полностью или частично;</li>
                        <li>делать скриншоты или записи экрана с целью распространения информации;</li>
                        <li>публиковать материалы в социальных сетях, мессенджерах или иных интернет-ресурсах;</li>
                        <li>использовать материалы Бота в интересах других компаний или конкурентов;</li>
                        <li>распространять информацию после прекращения трудовых отношений с компанией.</li>
                    </ul>

                    <h3 style="margin-top: 15px; margin-bottom: 10px; font-size: 16px;">3. Обязанности сотрудника</h3>
                    <p>Сотрудник обязуется:</p>
                    <ul style="padding-left: 20px; margin-top: 5px; margin-bottom: 15px;">
                        <li>использовать Бот исключительно в рабочих целях;</li>
                        <li>обеспечивать сохранность своего аккаунта Telegram;</li>
                        <li>не предоставлять доступ к Боту другим лицам;</li>
                        <li>незамедлительно сообщить компании в случае утраты доступа к своему аккаунту или обнаружения несанкционированного использования.</li>
                    </ul>

                    <h3 style="margin-top: 15px; margin-bottom: 10px; font-size: 16px;">4. Ответственность</h3>
                    <p>В случае нарушения условий настоящего Соглашения компания вправе:</p>
                    <ul style="padding-left: 20px; margin-top: 5px; margin-bottom: 15px;">
                        <li>ограничить или прекратить доступ к Боту;</li>
                        <li>применить меры дисциплинарной ответственности в соответствии с внутренними документами компании и трудовым законодательством;</li>
                        <li>потребовать возмещения причиненного компании ущерба, если распространение информации повлекло убытки.</li>
                    </ul>

                    <h3 style="margin-top: 15px; margin-bottom: 10px; font-size: 16px;">5. Интеллектуальная собственность</h3>
                    <p>Все материалы, размещенные в Боте, включая тексты, изображения, видео, инструкции, методические материалы, тесты, чек-листы и иные объекты, являются собственностью компании либо используются на законных основаниях.</p>
                    <p>Любое копирование, воспроизведение, распространение или использование данных материалов без письменного разрешения компании запрещено.</p>

                    <h3 style="margin-top: 15px; margin-bottom: 10px; font-size: 16px;">6. Срок действия</h3>
                    <p>Настоящее Соглашение действует в течение всего периода использования сотрудником корпоративного образовательного Telegram-бота, а обязательства по неразглашению конфиденциальной информации сохраняют силу и после прекращения трудовых отношений.</p>

                    <h3 style="margin-top: 15px; margin-bottom: 10px; font-size: 16px;">7. Принятие условий</h3>
                    <p>Нажимая кнопку «Принимаю», начиная использование Бота либо продолжая работу с ним, сотрудник подтверждает, что:</p>
                    <ul style="padding-left: 20px; margin-top: 5px; margin-bottom: 15px;">
                        <li>ознакомился с условиями настоящего Соглашения;</li>
                        <li>понимает их содержание;</li>
                        <li>обязуется соблюдать все требования;</li>
                        <li>принимает ответственность за нарушение условий использования Бота.</li>
                    </ul>

                    <h3 style="margin-top: 15px; margin-bottom: 10px; font-size: 16px;">8. Ответственность за нарушение условий Соглашения</h3>
                    <p>8.1. В случае нарушения условий настоящего Соглашения Компания вправе применить к Сотруднику меры дисциплинарной ответственности в соответствии с действующим законодательством Республики Узбекистан и внутренними нормативными документами Компании.</p>
                    <p>8.2. Если в результате неправомерного распространения материалов корпоративного образовательного Telegram-бота Компании причинен имущественный, репутационный либо иной ущерб, Сотрудник обязан возместить причиненные убытки в полном объеме в порядке, установленном законодательством Республики Узбекистан.</p>
                    <p>8.3. В случае передачи третьим лицам доступа к Боту, распространения, копирования, публикации, продажи либо иного несанкционированного использования материалов Бота Компания вправе:</p>
                    <ul style="padding-left: 20px; margin-top: 5px; margin-bottom: 15px;">
                        <li>незамедлительно заблокировать доступ Сотрудника к Боту;</li>
                        <li>провести внутреннее служебное расследование;</li>
                        <li>применить меры дисциплинарной ответственности, вплоть до прекращения трудовых отношений по основаниям, предусмотренным законодательством;</li>
                        <li>обратиться в суд с требованием о взыскании причиненных убытков.</li>
                    </ul>
                    <p>8.4. В случае если между Компанией и Сотрудником заключено отдельное Соглашение о неразглашении конфиденциальной информации (NDA), ответственность за нарушение обязательств определяется также условиями указанного соглашения.</p>
                </div>
            </div>
            
            <div style="padding: 20px; background: var(--tg-theme-bg-color); box-shadow: 0 -4px 10px rgba(0,0,0,0.05);">
                <button id="btn-accept-rules" class="btn-primary" style="width: 100%; padding: 15px; border-radius: 12px; font-weight: 600;">Принимаю</button>
            </div>
        </div>
    </template>

    <template id="tpl-home">
        <div class="page home-page animate-fade-in">
            <div class="hero-section">
                <img src="img/logo_blue.png" alt="Matcha Club & Mari Wellness" class="hero-logo logo-light">
                <img src="img/logo_white.png" alt="Matcha Club & Mari Wellness" class="hero-logo logo-dark hidden">
                <p class="hero-text">Пространство здорового образа жизни, гастрономии и атмосферы.</p>
            </div>

            <div class="quick-actions">
                <div class="action-card premium-card" onclick="app.navigate('menu')">
                    <div class="action-content">
                        <h3>Изучить меню</h3>
                        <p>Блюда с подсчетом КБЖУ</p>
                    </div>
                    <div class="action-icon">🍵</div>
                </div>
                <div class="action-card premium-card" onclick="app.navigate('welcome')">
                    <div class="action-content">
                        <h3>Велком-бук</h3>
                        <p>О компании и ценностях</p>
                    </div>
                    <div class="action-icon">📖</div>
                </div>
                <div class="action-card premium-card" onclick="app.navigate('trainings')">
                    <div class="action-content">
                        <h3>Тренинги</h3>
                        <p>Прокачай навыки сервиса и продаж</p>
                    </div>
                    <div class="action-icon">🎓</div>
                </div>
                <div class="action-card premium-card" onclick="app.navigate('events')">
                    <div class="action-content">
                        <h3>События</h3>
                        <p>Уборки, тренинги и важные даты</p>
                    </div>
                    <div class="action-icon">📅</div>
                </div>
                <div class="action-card premium-card" onclick="app.showFact()">
                    <div class="action-content">
                        <h3>Факт дня</h3>
                        <p>Интересно о питании</p>
                    </div>
                    <div class="action-icon">💡</div>
                </div>
                <div class="action-card premium-card" onclick="app.showAttendanceMenu()" style="background: linear-gradient(135deg, rgba(74, 222, 128, 0.1) 0%, rgba(59, 130, 246, 0.1) 100%); border-color: rgba(74, 222, 128, 0.3);">
                    <div class="action-content">
                        <h3>Смена</h3>
                        <p>Отметка прихода / ухода</p>
                    </div>
                    <div class="action-icon">⏱</div>
                </div>
                <div class="action-card premium-card tour-card" onclick="app.navigate('tour')">
                    <div class="action-content">
                        <h3>Экскурсия</h3>
                        <p>Видео для новых сотрудников</p>
                    </div>
                    <div class="action-icon">🎬</div>
                </div>
            </div>
        </div>
    </template>

    <!-- ── Велком-бук ── -->
    <template id="tpl-welcome">
        <div class="page welcome-page animate-fade-in">
            <div class="welcome-hero premium-card">
                <div class="welcome-hero-icon">📖</div>
                <h2>Велком-бук</h2>
                <p id="welcome-company-msg">Загрузка...</p>
            </div>
            <div id="welcome-sections" class="welcome-sections"></div>
        </div>
    </template>

    <!-- ── Раздел велком-бука ── -->
    <template id="tpl-welcome-section">
        <div class="page welcome-section-page animate-fade-in">
            <button class="back-btn" id="welcome-back-btn">
                <span class="back-icon">←</span> Назад
            </button>
            <div class="section-content premium-card">
                <h2 id="section-title">Заголовок</h2>
                <div id="section-body" class="section-body"></div>
            </div>
        </div>
    </template>

    <template id="tpl-menu">
        <div class="page menu-page animate-fade-in">
            <button id="menu-back-btn" class="back-btn hidden" onclick="app.renderMenuCategories()">
                <span class="back-icon">←</span> Назад
            </button>
            <div class="menu-tabs glass-panel">
                <button class="tab-btn active" data-type="kitchen">🍽️ Кухня</button>
                <button class="tab-btn" data-type="bar">🍹 Бар</button>
            </div>
            <div id="categories-container" class="categories-grid"></div>
            <div id="items-container" class="items-list hidden">
                <div id="items-grid" class="grid-2col"></div>
            </div>
        </div>
    </template>

    <template id="tpl-profile">
        <div class="page profile-page animate-fade-in">
            <div class="profile-header premium-card">
                <div class="avatar" id="prof-avatar">👤</div>
                <h2 id="prof-name">Загрузка...</h2>
                <div class="rank-badge" id="prof-rank">Стажёр</div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-box premium-card">
                    <span class="stat-icon">🍃</span>
                    <span class="stat-val" id="prof-points">0</span>
                    <span class="stat-label">Баллы</span>
                </div>
                <div class="stat-box premium-card">
                    <span class="stat-icon">🎯</span>
                    <span class="stat-val" id="prof-quizzes">0</span>
                    <span class="stat-label">Квизы</span>
                </div>
                <div class="stat-box premium-card">
                    <span class="stat-icon">🎁</span>
                    <span class="stat-val" id="prof-rewards">0</span>
                    <span class="stat-label">Награды</span>
                </div>
            </div>

            <div class="reward-section premium-card">
                <div class="reward-header">
                    <h3>Напитки</h3>
                    <span class="drinks-count">Доступно: <strong id="prof-drinks">0</strong></span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="prof-progress"></div>
                </div>
                <p class="progress-text" id="prof-progress-text">0 / 20 до напитка</p>
                <button id="btn-claim-reward" class="btn-primary" disabled>Обменять на напиток</button>
            </div>
            
            <div class="leaderboard-section">
                <h3 class="section-title">Топ 10 сотрудников</h3>
                <div id="leaderboard-list" class="premium-card list-card"></div>
            </div>
        </div>
    </template>

    <template id="tpl-quiz">
        <div class="page quiz-page animate-fade-in">
            <div id="quiz-intro" class="premium-card text-center">
                <div class="quiz-hero-icon">🎯</div>
                <h2>Квиз Matcha Club</h2>
                <p class="quiz-subtitle">Проверь знания и заработай на напиток!</p>
                <div class="quiz-bank-progress" id="quiz-bank-info">
                    <div class="bank-progress-bar">
                        <div class="bank-progress-fill" id="bank-fill"></div>
                    </div>
                    <p class="bank-progress-text" id="bank-text">Загрузка...</p>
                </div>
                <div class="quiz-rules text-left">
                    <div class="rule-item"><span class="rule-icon success">✅</span> +1 балл за верный ответ</div>
                    <div class="rule-item"><span class="rule-icon danger">❌</span> -2 балла за ошибку</div>
                    <div class="rule-item"><span class="rule-icon primary">🍹</span> 20 баллов = 1 напиток</div>
                    <div class="rule-item"><span class="rule-icon primary">🔄</span> Вопросы не повторяются</div>
                </div>
                <button id="btn-start-quiz" class="btn-primary">Начать квиз</button>
            </div>
            
            <div id="quiz-process" class="hidden">
                <div class="quiz-header">
                    <div class="quiz-progress-pill" id="quiz-progress">1/10</div>
                    <div class="quiz-score-pill" id="quiz-score">Баллы: 0</div>
                </div>
                <h3 id="quiz-question" class="question-text">Вопрос...</h3>
                <div id="quiz-options" class="options-list"></div>
            </div>
            
            <div id="quiz-result" class="hidden premium-card text-center">
                <div class="quiz-hero-icon">🎉</div>
                <h2>Квиз завершен!</h2>
                <div class="result-stats">
                    <div class="res-stat">✅ <strong id="quiz-res-correct">0</strong> верных</div>
                    <div class="res-stat">❌ <strong id="quiz-res-wrong">0</strong> ошибок</div>
                </div>
                <div class="final-score-box">
                    <p>Заработано баллов</p>
                    <h3 class="final-score" id="quiz-res-points">0</h3>
                </div>
                <p class="bank-progress-text" id="result-bank-text" style="margin-bottom:12px;"></p>
                <div style="display:flex; gap:10px; flex-direction:column;">
                    <button class="btn-primary" id="btn-play-again">🔄 Ещё раунд</button>
                    <button class="btn-secondary" onclick="app.navigate('profile')">В профиль</button>
                </div>
            </div>
        </div>
    </template>

    <!-- ── Экскурсия ── -->
    <template id="tpl-tour">
        <div class="page tour-page animate-fade-in">
            <div class="tour-hero">
                <div class="tour-hero-icon">🎬</div>
                <h2>Экскурсия по Matcha Club</h2>
                <p class="tour-subtitle">Добро пожаловать в команду! Посмотрите видео — познакомьтесь с нашим заведением, командой и атмосферой.</p>
            </div>

            <div id="tour-videos" class="tour-videos">
                <!-- Видео будут загружены динамически -->
            </div>

            <div class="tour-tip premium-card">
                <div class="tour-tip-icon">💡</div>
                <div>
                    <b>Совет:</b> Смотрите видео в наушниках для лучшего погружения в атмосферу заведения.
                </div>
            </div>
        </div>
    </template>

    <!-- ── Тренинги: список ── -->
    <template id="tpl-trainings">
        <div class="page trainings-page animate-fade-in">
            <div class="trainings-hero premium-card">
                <div class="trainings-hero-icon">🎓</div>
                <h2>Тренинги</h2>
                <p>Короткие обучающие модули, которые помогут прокачать сервис и продажи</p>
            </div>
            <div id="trainings-list" class="trainings-list">
                <div class="loader"><div class="spinner"></div></div>
            </div>
        </div>
    </template>

    <!-- ── Тренинги: просмотр модуля ── -->
    <template id="tpl-training-view">
        <div class="page training-view-page animate-fade-in">
            <button class="back-btn" id="training-back-btn">
                <span class="back-icon">←</span> Назад
            </button>
            <div class="training-view-header">
                <div class="training-progress-pill" id="training-progress-pill">Модуль 1/1</div>
                <div class="training-dots" id="training-dots"></div>
            </div>
            <div class="module-card premium-card">
                <h2 id="module-title">Заголовок</h2>
                <div id="module-body" class="module-body"></div>
            </div>
            <div class="training-nav-buttons">
                <button class="btn-secondary hidden" id="training-prev-btn">← Назад</button>
                <button class="btn-primary" id="training-next-btn">Дальше →</button>
            </div>
        </div>
    </template>

    <!-- ── События ── -->
    <template id="tpl-events">
