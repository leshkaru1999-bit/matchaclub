version: '3.8'

services:
  bot:
    build: .
    container_name: matcha-club-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./matcha_club.db:/app/matcha_club.db
      - ./static:/app/static
      - ./.env:/app/.env

  caddy:
    image: caddy:latest
    container_name: matcha-club-caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

volumes:
  caddy_data:
  caddy_config:
